<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Login</title>
  <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="cart.html">Cart</a>
      <span id="auth-nav-slot"></span>
    </nav>
  </header>

  <main>
    <h1>Login</h1>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="register.html">Register</a></p>
  </main>

  <footer class="site-footer"><p>&copy; 2025 ShopNow.</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="JS/app.js"></script>
</body>
</html>
